<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Завантаження</title>
<style>
:root{--bg:#02040c;--blue:#5ec8ff;--red:#ff5a4a;--gold:#ffe81f;--txt:#d6ecff;--dim:#6f93b3}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:Bahnschrift,'Arial Narrow','Segoe UI',Arial,sans-serif;color:var(--txt);user-select:none;text-transform:uppercase}
#c{position:absolute;inset:0;width:100%;height:100%}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6) 100%)}
.hud{position:absolute;pointer-events:none}
#top{top:14px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:0 22px;gap:16px}
.panel{--c:var(--blue);position:relative;min-width:272px;max-width:310px;padding:6px 10px 7px;font-size:9.5px;letter-spacing:1px;color:var(--c);
  background:linear-gradient(180deg,rgba(10,30,60,.55),rgba(3,10,25,.7));border:1px solid var(--c);box-shadow:0 0 14px rgba(94,200,255,.25),inset 0 0 22px rgba(94,200,255,.08);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.panel.red{--c:var(--red);background:linear-gradient(180deg,rgba(60,12,10,.55),rgba(25,4,4,.7));box-shadow:0 0 14px rgba(255,90,74,.25),inset 0 0 22px rgba(255,90,74,.08)}
.panel .hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--c);padding-bottom:5px;margin-bottom:6px;opacity:.95}
.name{font-weight:700;font-size:12px;letter-spacing:2px;text-shadow:0 0 8px var(--c)}
.id{font-size:9px;opacity:.65}
.bar{height:5px;background:rgba(255,255,255,.05);margin:1px 0 4px;border:1px solid var(--c);opacity:.95}
.bar i{display:block;height:100%;width:100%;background:var(--c);box-shadow:0 0 8px var(--c);transition:width .25s;-webkit-mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px);mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px)}
.lbl{font-size:9px;opacity:.8;display:flex;justify-content:space-between}
.lbl b{font-weight:400;color:#fff;opacity:.9}
.ros{display:flex;flex-wrap:wrap;gap:3px 9px;font-size:9px;margin-top:3px}
.ros span{opacity:.75}.ros b{font-weight:400;color:#fff}
.tac{font-size:10px;margin-top:5px;color:var(--gold);letter-spacing:2px}
.tac span{color:var(--c);opacity:.7}
.tur{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:9px;white-space:nowrap}
.tur .tl{opacity:.75;margin-right:3px;letter-spacing:2px}
.tur i{display:inline-flex;align-items:center;gap:2px;font-style:normal}
.tur i em{font-style:normal;opacity:.85;min-width:7px;text-align:right}
.tur i b{display:block;width:14px;height:5px;border:1px solid var(--c);position:relative;opacity:.9}
.tur i b u{position:absolute;left:0;top:0;bottom:0;background:var(--c);box-shadow:0 0 5px var(--c)}
.tur i.x em{opacity:.35}.tur i.x b{border-color:#7a2a20;background:repeating-linear-gradient(45deg,#5a1a12 0 1px,transparent 1px 3px)}
.tur .sep{opacity:.4;margin:0 2px}
#center{text-align:center;padding-top:2px}
#srv{font-size:20px;font-weight:700;letter-spacing:6px;color:var(--gold);text-shadow:0 0 18px rgba(255,232,31,.45)}
#map{font-size:10px;color:var(--dim);margin-top:4px;letter-spacing:3px}
#phase{font-size:10px;letter-spacing:5px;color:var(--blue);margin-top:10px;text-shadow:0 0 8px var(--blue)}
#phase:before{content:'◄ '}#phase:after{content:' ►'}
#bottom{left:0;right:0;bottom:0;padding:40px 24px 18px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
#status{font-size:11px;color:var(--dim);margin-bottom:6px;display:flex;justify-content:space-between;letter-spacing:2px}
#status b{color:var(--blue);font-weight:400}
#prog{height:8px;background:rgba(94,200,255,.06);border:1px solid var(--blue);box-shadow:0 0 10px rgba(94,200,255,.3);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 100%,8px 100%)}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2a8fd8,var(--blue));box-shadow:0 0 12px var(--blue);transition:width .3s;-webkit-mask:repeating-linear-gradient(90deg,#000 0 10px,transparent 10px 12px);mask:repeating-linear-gradient(90deg,#000 0 10px,transparent 10px 12px)}
#radio{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;width:560px;font-size:10px;line-height:1.45;text-transform:none;letter-spacing:.3px;
  background:linear-gradient(180deg,rgba(6,18,40,.7),rgba(2,8,20,.78));border:1px solid rgba(94,200,255,.5);border-top:2px solid var(--blue);box-shadow:0 0 14px rgba(94,200,255,.2);padding:6px 14px 8px;pointer-events:none;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px))}
#radio .rh{font-size:9px;letter-spacing:3px;color:var(--dim);margin-bottom:4px;display:flex;justify-content:space-between;text-transform:uppercase}
#radio .rh b{color:var(--red);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#radio .ln{animation:fin .35s;margin:1px 0}
#radio .ln .t{color:var(--dim);margin-right:6px;font-family:Consolas,monospace;font-size:10px}
#radio .ln .who{font-weight:700;text-transform:uppercase;letter-spacing:1px}
#radio .ln .tx{color:#e6f3ff}
#radio .ln.sys .tx{color:var(--gold)}
@keyframes fin{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
#result{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-start;padding-top:21vh;box-sizing:border-box;flex-direction:column;opacity:0;transition:opacity 1.5s;pointer-events:none}
#result h1{font-size:50px;margin:0;letter-spacing:10px;text-shadow:0 0 30px currentColor}
#result p{font-size:12px;color:var(--dim);margin-top:10px;letter-spacing:3px}
#mute{position:absolute;right:24px;bottom:84px;font-size:10px;color:var(--blue);cursor:pointer;letter-spacing:2px;border:1px solid var(--blue);padding:3px 9px;background:rgba(3,10,25,.7)}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="scan"></div><div id="vig"></div>

<div id="top" class="hud">
  <div class="panel" id="p0">
    <div class="hd"><span class="name" id="n0"></span><span class="id">Крейсер · борт 01</span></div>
    <div class="lbl"><span>Корпус</span><b id="h0">100%</b></div><div class="bar"><i id="hb0"></i></div>
    <div class="lbl"><span>Дефлекторний щит</span><b id="s0">100%</b></div><div class="bar"><i id="sb0"></i></div>
    <div class="ros" id="ros0"></div>
    <div class="tur"><span class="tl">Турелі</span><span id="tur0"></span></div>
    <div class="tac"><span>Тактика ·</span> <span id="tac0"></span></div>
  </div>
  <div id="center">
    <div id="srv">З'єднання</div>
    <div id="map">Очікування даних</div>
    <div id="phase"></div>
  </div>
  <div class="panel red" id="p1">
    <div class="hd"><span class="name" id="n1"></span><span class="id">Крейсер · борт 02</span></div>
    <div class="lbl"><span>Корпус</span><b id="h1">100%</b></div><div class="bar"><i id="hb1"></i></div>
    <div class="lbl"><span>Дефлекторний щит</span><b id="s1">100%</b></div><div class="bar"><i id="sb1"></i></div>
    <div class="ros" id="ros1"></div>
    <div class="tur"><span class="tl">Турелі</span><span id="tur1"></span></div>
    <div class="tac"><span>Тактика ·</span> <span id="tac1"></span></div>
  </div>
</div>

<div id="radio"><div class="rh"><span>Радіоперехоплення · канал 7 · шифр</span><b>● REC</b></div><div id="rlines"></div></div>
<div id="mute" title="Увімкнути/вимкнути звук">SND: ON</div>
<div id="result" class="hud"><h1 id="rt"></h1><p id="rs"></p></div>

<div id="bottom" class="hud">
  <div id="status"><span id="st">Підключення</span><b id="pct">0%</b></div>
  <div id="prog"><i id="pb"></i></div>
</div>

<script>
/* =====================================================================
   ВЛАСНІ КАРТИНКИ / ЗВУКИ / МУЗИКА
   Просто поклади файл з потрібним іменем у папку assets/ поруч із цим html.
   Якщо файлу немає — використовується вбудована векторна модель / синтезований звук / синтезована музика.
   Картинки: PNG з прозорим фоном, ніс корабля дивиться ВПРАВО (другий борт дзеркалиться сам).
     assets/ship0.png, assets/ship1.png            — крейсери (лівий, правий)
     assets/background.png                         — фон
     assets/interceptor.png bait.png flanker.png gunship.png shieldship.png ace.png bomber.png — МЛА для обох бортів
     assets/interceptor_1.png ... (будь-який клас + _0 або _1)  — окрема картинка тільки для цього борту
   Звуки (mp3/ogg/wav): assets/turbolaser.mp3 light.mp3 blaster.mp3 shieldHit.mp3 shieldDown.mp3 torpedo.mp3
     explosion.mp3 bigExplosion.mp3 subDestroyed.mp3 radio.mp3 launch.mp3   і   assets/music.mp3 — фонова музика (loop)
   ===================================================================== */
const ASSETS={dir:'assets/',
  images:{ship0:'ship0.png',ship1:'ship1.png',background:'background.png'},
  craftImages:['interceptor','bait','flanker','gunship','shieldship','ace','bomber'],
  sounds:{turbolaser:'turbolaser.mp3',light:'light.mp3',blaster:'blaster.mp3',shieldHit:'shieldHit.mp3',shieldDown:'shieldDown.mp3',torpedo:'torpedo.mp3',explosion:'explosion.mp3',bigExplosion:'bigExplosion.mp3',subDestroyed:'subDestroyed.mp3',radio:'radio.mp3',launch:'launch.mp3'},
  music:'music.mp3',
  disable:[]            // напр. ['radio','light'] — повністю вимкнути ці звуки
};
const CONFIG={
  // hull — форма корпусу: wedge (клин) | frigate (фрегат з широким носом) | carrier (авіаносець) | dreadnought (дредноут) | hammerhead (молот)
  // turrets — розташування турелей у координатах моделі: x від -150 (корма) до 150 (ніс), y від -50 (верх) до 50 (низ). null = стандарт для цієї форми.
  //           Кількість турелей будь-яка: heavy — великі турболазери, light — малі (зенітні), gen — генератор щита (одна точка)
  // shield  — форма щита: {mode:'hug', sx, sy, pad} оболонка по корпусу (sx/sy — розтяг уздовж/поперек, pad — відступ)
  //           {mode:'ellipse', rx, ry} еліпс (радіуси у частках довжини корабля) · {mode:'capsule', rx, ry} капсула. null = стандарт для форми
  //           Для PNG-корабля щит і турелі за замовчуванням автоматичні (див. pngShield / pngTurrets нижче); власні координати turrets для PNG притягуються на непрозорі пікселі
  ships:[
    {name:'Вартовий', callsign:'ВАРТОВИЙ-АКТУАЛ', squad:'ГРІМ',   color:'#5ec8ff', color2:'#d9f2ff', hull:'wedge', turrets:null, shield:null},
    {name:'Багряний', callsign:'БАГРЯНИЙ-АКТУАЛ', squad:'ЯСТРУБ', color:'#ff5a4a', color2:'#ffd2c8', hull:'frigate', turrets:null, shield:null},
  ],
  // ЯКЩО Є PNG КОРАБЛЯ (assets/ship0.png, ship1.png) — усе підлаштовується під картинку автоматично:
  //   щит іде за контуром PNG, турелі розставляються на корпусі (heavy по центру, light уздовж бортів, генератор на кормі), двигуни на кормі.
  //   Дві змінні нижче керують щитом; turrets:'auto' можна замінити власними координатами, shield — своїм режимом.
  pngShield:{pad:12, smooth:.5},   // pad — внутрішній відступ щита від пікселів корабля (у пікселях моделі, 0..40); smooth — плавність обтікання 0 (різко, по кожному виступу) .. 1 (м'яко)
  pngTurrets:{heavy:3, light:5},   // скільки турелей розставляти автоматично на PNG-кораблі
  shieldColor:'#9cd6ff',  // колір дефлекторних щитів (обом бортам)
  shipLength:760, craftScale:2, world:{w:2600,h:1400},
  demoDuration:100,     // с — тривалість бою, якщо відкрити просто у браузері (у GMod — реальний прогрес, темп підлаштовується сам)
  volume:0.6, musicVolume:0.3,
  winner:null,          // null = випадково; 0 або 1
  tactics:null          // null = випадково; або ['strike','hedgehog'] (strike artillery swarm ambush gunline decap attrition pincer hedgehog blitz suppress)
};

/* ================= ОСНОВА ================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const WW=CONFIG.world.w,WH=CONFIG.world.h;let W=0,H=0,sc=1,ox=0,oy=0,T=0,shake=0;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;sc=Math.min(W/WW,H/WH);ox=(W-WW*sc)/2;oy=(H-WH*sc)/2;}
addEventListener('resize',resize);
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[Math.floor(Math.random()*a.length)];
const wrap=a=>{while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;};
const rgba=(hex,a)=>`rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})`;
const pip=(poly,x,y)=>{let r=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])r=!r;}return r;};
const load={gmod:false,total:0,needed:0,progress:0,disp:0,status:'Підключення',file:'',t0:null,p0:0,est:CONFIG.demoDuration,scaled:false};
let DM=1; // множник урону під темп завантаження
let run=0,runT=0,warp=-1,resultT=0,prevTactics=[null,null];const battle={p:0,virt:0,stallT:0,lastReal:-1,D:100,dispReal:0};
function loadImg(name){const i=new Image();i.ok=false;i.onload=()=>{i.ok=i.naturalWidth>0;};i.onerror=()=>{i.ok=false;};i.src=ASSETS.dir+name;return i;}
const IMG={bg:loadImg(ASSETS.images.background),ship:[loadImg(ASSETS.images.ship0),loadImg(ASSETS.images.ship1)],craft:[{},{}]};
ASSETS.craftImages.forEach(k=>{const g=loadImg(k+'.png');[0,1].forEach(s=>{const o=loadImg(k+'_'+s+'.png');IMG.craft[s][k]={g,o};});});
const craftImg=(side,k)=>{const e=IMG.craft[side][k];if(!e)return null;return e.o.ok?e.o:e.g.ok?e.g:null;};

/* ================= ЗВУК + МУЗИКА ================= */
const Snd={ctx:null,master:null,noise:null,pool:{},last:{},muted:false,music:null,mus:null,
  init(){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=CONFIG.volume;this.master.connect(this.ctx.destination);
      const n=this.ctx.createBuffer(1,this.ctx.sampleRate*3,this.ctx.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.noise=n;}catch(e){}
    for(const k in ASSETS.sounds){const pool={ok:true,a:[]};for(let i=0;i<6;i++){const a=new Audio(ASSETS.dir+ASSETS.sounds[k]);a.preload='auto';a.onerror=()=>{pool.ok=false;};pool.a.push(a);}this.pool[k]=pool;}
    const m=new Audio(ASSETS.dir+ASSETS.music);m.loop=true;m.volume=CONFIG.musicVolume;m.onerror=()=>{this.music=null;this.startSynthMusic();};m.oncanplay=()=>{this.music=m;m.play().catch(()=>{});};
    const resume=()=>{if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();if(this.music&&this.music.paused&&!this.muted)this.music.play().catch(()=>{});};
    ['click','keydown','pointerdown'].forEach(e=>addEventListener(e,resume));setInterval(resume,1500);},
  play(name,vol=1,x=null){if(this.muted||ASSETS.disable.includes(name))return;const now=performance.now();if(now-(this.last[name]||0)<45)return;this.last[name]=now;
    const pan=x==null?0:clamp((x/WW-.5)*1.6,-1,1);const pool=this.pool[name];
    if(pool&&pool.ok){const a=pool.a.find(a=>a.paused||a.ended)||pool.a[0];a.volume=clamp(vol*CONFIG.volume,0,1);try{a.currentTime=0;}catch(e){}a.play().catch(()=>{pool.ok=false;});return;}
    this.synth(name,vol,pan);},
  synth(name,vol,pan){const c=this.ctx;if(!c||c.state!=='running')return;const t=c.currentTime,g=c.createGain();let out=g;
    if(c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=pan;g.connect(p);out=p;}out.connect(this.master);
    const osc=(type,f0,f1,dur,v)=>{const o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);const gg=c.createGain();gg.gain.setValueAtTime(v*vol,t);gg.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(gg);gg.connect(g);o.start(t);o.stop(t+dur);};
    const noise=(dur,v,f0,f1,type='lowpass')=>{const s=c.createBufferSource();s.buffer=this.noise;s.loop=true;const f=c.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(10,f1),t+dur);const gg=c.createGain();gg.gain.setValueAtTime(v*vol,t);gg.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(gg);gg.connect(g);s.start(t,Math.random()*2);s.stop(t+dur);};
    switch(name){
      case 'turbolaser':osc('sawtooth',300,45,.5,.4);noise(.3,.15,2500,300);break;
      case 'light':osc('triangle',1600,700,.06,.05);break;
      case 'blaster':osc('square',1300,350,.08,.07);break;
      case 'shieldHit':osc('sine',700,1500,.22,.1);break;
      case 'shieldDown':osc('sawtooth',800,30,1.4,.4);noise(1.2,.3,3000,100);break;
      case 'torpedo':osc('sine',160,40,.35,.45);noise(.3,.2,900,100);break;
      case 'explosion':noise(.7,.5,900,80);osc('sine',90,30,.5,.4);break;
      case 'subDestroyed':noise(1,.6,1200,60);osc('sine',120,25,.8,.5);osc('square',400,80,.3,.1);break;
      case 'bigExplosion':noise(3,.9,1500,40);osc('sine',70,15,2.5,.9);noise(2,.4,300,40);break;
      case 'radio':osc('square',1100,1100,.05,.05);setTimeout(()=>{try{osc('square',1400,1400,.05,.05)}catch(e){}},80);noise(.25,.03,2000,2000,'bandpass');break;
      case 'launch':noise(.5,.25,400,3000,'bandpass');break;}},
  // синтезована фонова музика: тягучий пад + низький пульс, наростає з прогресом бою
  startSynthMusic(){const c=this.ctx;if(!c||this.mus)return;const mg=c.createGain();mg.gain.value=0;mg.connect(c.destination);const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=400;f.Q.value=2;f.connect(mg);
    const voices=[];[0,7,12,19].forEach((semi,i)=>{const o=c.createOscillator();o.type=i%2?'sawtooth':'triangle';const g=c.createGain();g.gain.value=i?.12:.2;o.connect(g);g.connect(f);o.start();voices.push({o,semi,g});});
    const lfo=c.createOscillator();lfo.frequency.value=.08;const lg=c.createGain();lg.gain.value=180;lfo.connect(lg);lg.connect(f.frequency);lfo.start();
    const pulse=c.createOscillator();pulse.type='sine';const pg=c.createGain();pg.gain.value=0;pulse.connect(pg);pg.connect(mg);pulse.start();
    this.mus={mg,f,voices,pulse,pg,chord:0,next:0,beat:0};
    const chords=[[0,3,7,10],[-4,0,3,7],[-2,2,5,10],[-5,-2,2,7]]; // мінорна прогресія
    this.mus.tick=()=>{const m=this.mus,now=c.currentTime,p=load.disp;if(this.muted){m.mg.gain.setTargetAtTime(0,now,.3);return;}
      m.mg.gain.setTargetAtTime(CONFIG.musicVolume*(0.7+p*.5),now,1);m.f.frequency.setTargetAtTime(300+p*1400,now,2);
      if(now>=m.next){m.next=now+8;const ch=chords[m.chord++%chords.length];m.voices.forEach((v,i)=>{const semi=ch[i]+(i>=2?12:0)-12;v.o.frequency.setTargetAtTime(110*Math.pow(2,semi/12),now,1.5);});}

function fitToImage(c,o){ // контур PNG → корпус, щит, турелі, двигуни
  let d;try{d=o.getContext('2d').getImageData(0,0,o.width,o.height).data;}catch(e){c.fitErr=true;console.warn('PNG корабля: браузер не дає читати пікселі (відкрито через file://). Відкрийте через http — тоді щит і турелі підлаштуються.');return;}
  const w=o.width,h=o.height,A=(x,y)=>x<0||y<0||x>=w||y>=h?0:d[(y*w+x)*4+3];
  const step=10,top=[],bot=[];let minX=w,maxX=0;
  for(let x=0;x<w;x+=step){let t=-1,b=-1;for(let y=0;y<h;y++){if(A(x,y)>40){if(t<0)t=y;b=y;}}if(t>=0){top.push([x,t]);bot.push([x,b]);if(x<minX)minX=x;if(x>maxX)maxX=x;}}
  if(top.length<4)return;
  const loc=p=>[p[0]/2-c.cw/2,p[1]/2-c.ch/2];
  let poly=top.map(loc).concat(bot.reverse().map(loc));c.hullL=poly;
  const shp=c.shp;if(shp.mode==='image'){const pad=(shp.pad==null?14:shp.pad)*K/1.33,passes=Math.round(clamp(shp.smooth==null?.5:shp.smooth,0,1)*8);
    let sp=poly.map(p=>{const l=Math.hypot(p[0],p[1])||1;return [p[0]+p[0]/l*pad,p[1]+p[1]/l*pad];});
    for(let k=0;k<passes;k++)sp=sp.map((p,i)=>{const a=sp[(i+sp.length-1)%sp.length],b=sp[(i+1)%sp.length];return [(a[0]+p[0]*2+b[0])/4,(a[1]+p[1]*2+b[1])/4];});
    c.shieldL=sp;}
  // двигуни: корма картинки
  const rx=minX;let ys=[];for(let y=0;y<h;y++)if(A(rx+6,y)>40)ys.push(y);
  if(ys.length){const y0=ys[0]/2-c.ch/2,y1=ys[ys.length-1]/2-c.ch/2,ex=rx/2-c.cw/2;c.engines=[.2,.5,.8].map(f=>({x:ex,y:y0+(y1-y0)*f}));}
  // турелі
  if(c.autoTurrets){ // автоматична розстановка за контуром: великі — по центральній лінії, малі — уздовж бортів, генератор — на кормі
    const cols=top.map((t,i)=>({x:t[0]/2-c.cw/2,t:t[1]/2-c.ch/2,b:bot[bot.length-1-i][1]/2-c.ch/2}));cols.sort((a,b)=>a.x-b.x);
    const x0=cols[0].x,x1=cols[cols.length-1].x,len=x1-x0;const at=f=>{const x=x0+len*f;let best=cols[0];for(const q of cols)if(Math.abs(q.x-x)<Math.abs(best.x-x))best=q;return best;};
    const nH=CONFIG.pngTurrets.heavy,nL=CONFIG.pngTurrets.light;c.subs.length=0;let n=1;
    const add=(kind,x,y)=>c.subs.push({kind,n:kind==='gen'?'Г':n++,lx:x,ly:y,hp:1,max:1,cd:rand(0,2),alive:true,ang:0});
    for(let i=0;i<nH;i++){const q=at(.3+.55*i/Math.max(1,nH-1));const hh=(q.b-q.t)/2,cy=(q.t+q.b)/2;add('heavy',q.x,nH>1&&i<nH-1?cy+(i%2?1:-1)*hh*.45:cy);}
    for(let i=0;i<nL;i++){const q=at(.12+.78*i/Math.max(1,nL-1));const hh=(q.b-q.t)/2,cy=(q.t+q.b)/2;add('light',q.x,cy+(i%2?1:-1)*hh*.72);}
    {const q=at(.2);add('gen',q.x,(q.t+q.b)/2);}}
  for(const s of c.subs){let lx=s.lx,ly=s.ly,n=0;while(n++<80&&A(Math.round((lx+c.cw/2)*2),Math.round((ly+c.ch/2)*2))<=40){lx*=.94;ly*=.94;}s.lx=lx;s.ly=ly;}
  c.fitted=true;
}
function shieldPoly(hd,shp){ // контур щита у локальних координатах (×K)
  if(shp.mode==='ellipse'||shp.mode==='capsule'){const pts=[],n=28,rx=(shp.rx||1.2)*150,ry=(shp.ry||.55)*150;
    for(let i=0;i<n;i++){const a=i/n*Math.PI*2;let x=Math.cos(a)*rx,y=Math.sin(a)*ry;
      if(shp.mode==='capsule'){const r=ry,cx=Math.max(0,rx-r);x=Math.cos(a)*r+Math.sign(Math.cos(a))*cx;y=Math.sin(a)*r;}pts.push([x*K,y*K]);}return pts;}
  const sx=shp.sx||1.16,sy=shp.sy||1.9,pad=shp.pad||28;
  return hd.poly.map(p=>{const l=Math.hypot(p[0],p[1])||1;return [p[0]*sx*K+p[0]/l*pad*K,p[1]*sy*K+p[1]/l*(pad+4)*K];});
}

/* ================= СЦЕНАРІЙ (режисер) ================= */
let winner,loser,script=[],phaseName='';
const PH=[[0,'Зближення'],[.1,'Дуель винищувачів'],[.3,'Бомбардувальні рейди'],[.58,'Генеральна битва'],[.82,'Прорив оборони'],[.93,'Фінальний штурм']];
function planBattle(){
  const w=CONFIG.winner===0||CONFIG.winner===1?CONFIG.winner:(Math.random()<.5?0:1);winner=cruisers[w];loser=cruisers[1-w];
  const Wn=winner,Ln=loser,j=()=>rand(-.025,.025);
  loser.shieldFallAt=.70+j();winner.shieldFallAt=.86+j();
  const ev=(at,fn)=>script.push({at:clamp(at,0,.995),fn,done:false});
  const keys=Object.keys(TACTICS);
  cruisers.forEach((c,i)=>{const k=CONFIG.tactics&&run===0&&CONFIG.tactics[i]||pick(keys.filter(k=>k!==prevTactics[i]));prevTactics[i]=k;c.tactic=TACTICS[k];c.fireRate=c.tactic.fire;c.hangar={...c.tactic.hangar};c.reserve={...c.tactic.reserve};
    document.getElementById('tac'+i).textContent=c.tactic.name;c.tactic.plan(c,(at,fn)=>ev(at+rand(-.015,.015),fn),cruisers[1-i]);});
  const A=c=>c.cs;
  ev(.005,()=>{radio('ЦЕНТР',`Два крейсери вийшли з гіперпростору. Дистанція ${Math.round(rand(80,120))} тис. км.`,'#ffe81f',1);});
  ev(.02,()=>{cruisers.forEach(c=>radio(A(c),`Контакт. Бойова тривога. Тактика: «${c.tactic.name}». ${c.tactic.brief}`,c.col));});
  ev(.08,()=>{cruisers.forEach(c=>c.canFire=true);radio(A(Wn),'Дистанція ефективна. Головний калібр — вогонь!',Wn.col);radio(A(Ln),'Турболазери — вогонь по готовності. Тримати щити.',Ln.col);});
  ev(.25+j(),()=>{radio(SQ(pick(cruisers)),pick(['Зайнятий, зайнятий! Двоє на хвості!','Є один! Горить!','Головний калібр по мені — пройшов повз, ухилився.']),'#e6f3ff');});

    if(d<SD){const f=(SD-d)/SD*90*dt,px=dx/d*f,py=dy/d*f;a.x-=px;a.y-=py;b.x+=px;b.y+=py;const ang=Math.atan2(dy,dx);a.a+=clamp(wrap(ang+Math.PI-a.a),-1,1)*dt*1.5*(SD-d)/SD;b.a+=clamp(wrap(ang-b.a),-1,1)*dt*1.5*(SD-d)/SD;}}}}

const SUBDMG={blaster:{light:.16,heavy:.07,gen:.035},turbo:{light:.5,heavy:.18,gen:.1},torpedo:{light:.7,heavy:.4,gen:.24}};
function updBolts(dt){
  for(let i=bolts.length-1;i>=0;i--){const b=bolts[i];
    if(b.kind==='torpedo'){const tp=b.tsub&&b.tsub.alive?subPos(b.target,b.tsub):{x:b.target.x,y:b.target.y};const a=Math.atan2(tp.y-b.y,tp.x-b.x),ca=Math.atan2(b.vy,b.vx),na=ca+clamp(wrap(a-ca),-2.2*dt,2.2*dt);b.vx=Math.cos(na)*260;b.vy=Math.sin(na)*260;parts.push({x:b.x,y:b.y,vx:0,vy:0,life:.3,max:.3,r:2.5,col:'#ffd27a'});
      b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;const en=b.target;
      if(en.alive&&Math.hypot(tp.x-b.x,tp.y-b.y)<16){if(b.tsub&&b.tsub.alive)damageSub(en,b.tsub,SUBDMG.torpedo[b.tsub.kind]*DM);else{const s=nearestSub(en,'heavy',b.x,b.y)||nearestSub(en,'light',b.x,b.y);if(s&&Math.random()<.4)damageSub(en,s,.3*DM);}
        en.hull-=.03;boom(b.x,b.y,26,5,'#ffcf60');Snd.play('explosion',.7,b.x);shake=Math.max(shake,5);bolts.splice(i,1);continue;}
      if(b.life<=0||!en.alive)bolts.splice(i,1);continue;}
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0||b.x<-80||b.x>WW+80||b.y<-80||b.y>WH+80){bolts.splice(i,1);continue;}
    const en=cruisers[1-b.side];let hit=false;
    // міні-щити щитоносців перехоплюють головний калібр
    if(b.kind==='turbo'){for(const k of crafts){if(k.side===b.side||k.type!=='shieldship'||k.bub<=.15)continue;if(Math.hypot(k.x-b.x,k.y-b.y)<CFG.shieldship.bubble){k.bub-=.4;boom(b.x,b.y,8,2,cruisers[k.side].col);Snd.play('shieldHit',.6,b.x);parts.push({x:k.x,y:k.y,vx:0,vy:0,life:.25,max:.25,r:CFG.shieldship.bubble*1.1,col:rgba(cruisers[k.side].col,.5),flash:true});hit=true;break;}}}
    if(!hit&&en.alive&&b.kind!=='light'){
      if(!b.inside&&inShield(en,b.x,b.y)){en.shield-=b.cdmg;ripples.push({c:en,x:b.x,y:b.y,t:0,s:b.kind==='turbo'?1:.4});
        if(b.kind==='turbo'){boom(b.x,b.y,5,1.5,en.col2);Snd.play('shieldHit',.5,b.x);}hit=true;}
      else if(inHull(en,b.x,b.y,1.12)){let s=null,sd=20;for(const q of en.subs){if(!q.alive)continue;const p=subPos(en,q),d=Math.hypot(p.x-b.x,p.y-b.y);if(d<sd){sd=d;s=q;}}
        if(s){damageSub(en,s,SUBDMG[b.kind][s.kind]*(b.sm||1)*DM);hit=true;}
        if(b.kind==='turbo'&&inHull(en,b.x,b.y)){en.hull-=b.cdmg;boom(b.x,b.y,12,2.8,'#ffb060');Snd.play('explosion',.35,b.x);shake=Math.max(shake,2);hit=true;}}
    }
    if(!hit){const r=(b.kind==='turbo'?7:b.kind==='light'?7:9)*(.5+CS*.5);
      for(let j=crafts.length-1;j>=0;j--){const k=crafts[j];if(k.side===b.side)continue;
        if(Math.abs(k.x-b.x)<r&&Math.abs(k.y-b.y)<r){k.hp-=b.kind==='turbo'?20:b.dmg;hit=true;if(k.hp<=0)killCraft(k,j);else parts.push({x:k.x,y:k.y,vx:0,vy:0,life:.12,max:.12,r:4,col:'#fff'});break;}}}
    if(hit)bolts.splice(i,1);}
}

  ctx.shadowBlur=0;
  crafts.forEach(drawCraft);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=1/60;if(p.life<=0){parts.splice(i,1);continue;}p.x+=p.vx/60;p.y+=p.vy/60;const a=p.life/p.max;
    ctx.globalAlpha=p.smoke?a*.35:a;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.1,p.flash?p.r*a:p.r*(p.smoke?(2-a):1)),0,6.29);ctx.fill();}
  ctx.globalAlpha=1;if(shake>0)shake*=.9;if(shake<.3)shake=0;
}

/* ================= ЦИКЛ ================= */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  updLoad(dt);cruisers.forEach(c=>updCruiser(c,dt));for(let i=crafts.length-1;i>=0;i--)updCraft(crafts[i],i,dt);
  separate(dt);updBolts(dt);flushRadio(dt);updHUD(dt);draw();requestAnimationFrame(frame);}

/* ================= КОЛБЕКИ GARRY'S MOD ================= */
window.GameDetails=function(servername,serverurl,mapname,maxplayers,steamid,gamemode){load.gmod=true;
  document.getElementById('srv').textContent=servername||'Сервер';document.getElementById('map').textContent='Карта: '+mapname+' · Режим: '+gamemode+' · Слоти: '+maxplayers;};
window.SetFilesTotal=function(t){load.gmod=true;load.total=t;load.needed=t;}; // до першого SetFilesNeeded вважаємо, що нічого ще не скачано
window.SetFilesNeeded=function(n){load.gmod=true;load.needed=n;};
window.DownloadingFile=function(f){load.file=f;};
window.SetStatusChanged=function(s){load.status=s;load.file='';};

/* ================= СТАРТ ================= */
for(let i=0;i<420;i++)stars.push({x:Math.random(),y:Math.random(),r:rand(.3,1.7),a:rand(.15,.9),tw:rand(1,4),p:rand(0,6),d:rand(.5,2)});
cruisers.push(mkCruiser(0),mkCruiser(1));resize();cruisers.forEach(c=>{c.hullW=c.hullL.map(q=>[c.x+q[0]*c.dir,c.y+q[1]]);c.shieldW=c.shieldL.map(q=>[c.x+q[0]*c.dir,c.y+q[1]]);});
cruisers.forEach((c,i)=>{document.getElementById('n'+i).textContent=c.name;});
planBattle();Snd.init();requestAnimationFrame(frame);
</script>
