<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Завантаження</title>
<!-- VERSION 14 — якщо на сервері не видно змін, додайте ?v=14 до sv_loadingurl (кеш) -->
<style>
:root{--bg:#02040c;--blue:#5ec8ff;--red:#ff5a4a;--gold:#ffe81f;--txt:#d6ecff;--dim:#6f93b3}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:Bahnschrift,'Arial Narrow','Segoe UI',Arial,sans-serif;color:var(--txt);user-select:none;text-transform:uppercase}
#c{position:absolute;inset:0;width:100%;height:100%}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6) 100%)}
.hud{position:absolute;pointer-events:none}
#top{top:14px;bottom:0;left:0;right:0;display:flex;justify-content:center;align-items:flex-start;padding:0 22px;gap:16px}
#p1{position:absolute;right:22px;top:0}
#p0{position:absolute;left:22px;bottom:110px}
.panel{--c:var(--blue);position:relative;min-width:272px;max-width:390px;padding:6px 10px 7px;font-size:9.5px;letter-spacing:1px;color:var(--c);
  background:linear-gradient(180deg,rgba(10,30,60,.55),rgba(3,10,25,.7));border:1px solid var(--c);box-shadow:0 0 14px rgba(94,200,255,.25),inset 0 0 22px rgba(94,200,255,.08);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
@keyframes pf{0%,45%{box-shadow:0 0 30px var(--c),inset 0 0 34px var(--c)}}
.panel.flash{animation:pf .8s steps(8)}
.panel.red{--c:var(--red);background:linear-gradient(180deg,rgba(60,12,10,.55),rgba(25,4,4,.7));box-shadow:0 0 14px rgba(255,90,74,.25),inset 0 0 22px rgba(255,90,74,.08)}
.panel .hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--c);padding-bottom:5px;margin-bottom:6px;opacity:.95}
.name{font-weight:700;font-size:12px;letter-spacing:2px;text-shadow:0 0 8px var(--c)}
.id{font-size:9px;opacity:.65}
.bar{height:5px;background:rgba(255,255,255,.05);margin:1px 0 4px;border:1px solid var(--c);opacity:.95}
.bar i{display:block;height:100%;width:100%;background:var(--c);box-shadow:0 0 8px var(--c);transition:width .25s;-webkit-mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px);mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px)}
.lbl{font-size:9px;opacity:.8;display:flex;justify-content:space-between}
.lbl b{font-weight:400;color:#fff;opacity:.9}
.ros{display:flex;flex-wrap:wrap;gap:3px 9px;font-size:9px;margin-top:3px}
.ros span{opacity:.75}.ros b{font-weight:400;color:#fff}
.tac{font-size:10px;margin-top:5px;color:var(--gold);letter-spacing:2px}
.tac span{color:var(--c);opacity:.7}
.tur{display:flex;align-items:center;gap:3px;flex-wrap:nowrap;margin-top:6px;font-size:9px;white-space:nowrap}
.tur .tl{opacity:.75;margin-right:3px;letter-spacing:2px}
.tur i{display:inline-flex;align-items:center;gap:2px;font-style:normal}
.tur i em{font-style:normal;opacity:.85;min-width:7px;text-align:right}
.tur i b{display:block;width:9px;height:5px;border:1px solid var(--c);position:relative;opacity:.9}
.tur i b u{position:absolute;left:0;top:0;bottom:0;background:var(--c);box-shadow:0 0 5px var(--c)}
.tur i.x em{opacity:.35}.tur i.x b{border-color:#7a2a20;background:repeating-linear-gradient(45deg,#5a1a12 0 1px,transparent 1px 3px)}
.tur .sep{opacity:.4;margin:0 2px}
#center{text-align:center;padding-top:2px}
#srv{font-size:20px;font-weight:700;letter-spacing:6px;color:var(--gold);text-shadow:0 0 18px rgba(255,232,31,.45)}
#map{font-size:10px;color:var(--dim);margin-top:4px;letter-spacing:3px}
#phase{font-size:10px;letter-spacing:5px;color:var(--blue);margin-top:10px;text-shadow:0 0 8px var(--blue)}
#phase:before{content:'◄ '}#phase:after{content:' ►'}
#bottom{left:0;right:0;bottom:0;padding:40px 24px 18px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
#status{font-size:11px;color:var(--dim);margin-bottom:6px;display:flex;justify-content:space-between;letter-spacing:2px}
#status b{color:var(--blue);font-weight:400}
#prog{height:8px;background:rgba(94,200,255,.06);border:1px solid var(--blue);box-shadow:0 0 10px rgba(94,200,255,.3);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 100%,8px 100%)}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2a8fd8,var(--blue));box-shadow:0 0 12px var(--blue);transition:width .3s;-webkit-mask:repeating-linear-gradient(90deg,#000 0 10px,transparent 10px 12px);mask:repeating-linear-gradient(90deg,#000 0 10px,transparent 10px 12px)}
#radio{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;width:560px;font-size:10px;line-height:1.45;text-transform:none;letter-spacing:.3px;
  background:linear-gradient(180deg,rgba(6,18,40,.7),rgba(2,8,20,.78));border:1px solid rgba(94,200,255,.5);border-top:2px solid var(--blue);box-shadow:0 0 14px rgba(94,200,255,.2);padding:6px 14px 8px;pointer-events:none;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px))}
#radio .rh{font-size:9px;letter-spacing:3px;color:var(--dim);margin-bottom:4px;display:flex;justify-content:space-between;text-transform:uppercase}
#radio .rh b{color:var(--red);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#radio .ln{animation:fin .35s;margin:1px 0}
#radio .ln .t{color:var(--dim);margin-right:6px;font-family:Consolas,monospace;font-size:10px}
#radio .ln .who{font-weight:700;text-transform:uppercase;letter-spacing:1px}
#radio .ln .tx{color:#e6f3ff}
#radio .ln.sys .tx{color:var(--gold)}
@keyframes fin{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
#result{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-start;padding-top:21vh;box-sizing:border-box;flex-direction:column;opacity:0;transition:opacity 1.5s;pointer-events:none}
#result h1{font-size:50px;margin:0;letter-spacing:10px;text-shadow:0 0 30px currentColor}
#result p{font-size:12px;color:var(--dim);margin-top:10px;letter-spacing:3px}
#mute{position:absolute;right:24px;bottom:84px;font-size:10px;color:var(--blue);cursor:pointer;letter-spacing:2px;border:1px solid var(--blue);padding:3px 9px;background:rgba(3,10,25,.7)}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="scan"></div><div id="vig"></div>

<div id="top" class="hud">
  <div class="panel" id="p0">
    <div class="hd"><span class="name" id="n0"></span><span class="id">Крейсер · борт 01</span></div>
    <div class="lbl"><span>Корпус</span><b id="h0">100%</b></div><div class="bar"><i id="hb0"></i></div>
    <div class="lbl"><span>Дефлекторний щит</span><b id="s0">100%</b></div><div class="bar"><i id="sb0"></i></div>
    <div class="ros" id="ros0"></div>
    <div class="tur"><span class="tl">Турелі</span><span id="tur0"></span></div>
    <div class="tac"><span>Тактика ·</span> <span id="tac0"></span></div>
  </div>
  <div id="center">
    <div id="srv">З'єднання</div>
    <div id="map">Очікування даних</div>
    <div id="phase"></div>
  </div>
  <div class="panel red" id="p1">
    <div class="hd"><span class="name" id="n1"></span><span class="id">Крейсер · борт 02</span></div>
    <div class="lbl"><span>Корпус</span><b id="h1">100%</b></div><div class="bar"><i id="hb1"></i></div>
    <div class="lbl"><span>Дефлекторний щит</span><b id="s1">100%</b></div><div class="bar"><i id="sb1"></i></div>
    <div class="ros" id="ros1"></div>
    <div class="tur"><span class="tl">Турелі</span><span id="tur1"></span></div>
    <div class="tac"><span>Тактика ·</span> <span id="tac1"></span></div>
  </div>
</div>

<div id="radio"><div class="rh"><span>Радіоперехоплення · канал 7 · шифр</span><b>● REC</b></div><div id="rlines"></div></div>
<div id="mute" title="Увімкнути/вимкнути звук">SND: ON</div>
<div id="result" class="hud"><h1 id="rt"></h1><p id="rs"></p></div>

<div id="bottom" class="hud">
  <div id="status"><span id="st">Підключення</span><b id="pct">0%</b></div>
  <div id="prog"><i id="pb"></i></div>
</div>

<script>
/* =====================================================================
   ВЛАСНІ КАРТИНКИ / ЗВУКИ / МУЗИКА
   Просто поклади файл з потрібним іменем у папку assets/ поруч із цим html.
   Якщо файлу немає — використовується вбудована векторна модель / синтезований звук / синтезована музика.
   Картинки: PNG з прозорим фоном, ніс корабля дивиться ВПРАВО (другий борт дзеркалиться сам).
     assets/ship0.png, assets/ship1.png            — крейсери (лівий, правий)
     assets/background.png                         — фон
     assets/interceptor.png bait.png flanker.png gunship.png shieldship.png ace.png bomber.png — МЛА для обох бортів
     assets/interceptor_1.png ... (будь-який клас + _0 або _1)  — окрема картинка тільки для цього борту
   Турелі: assets/turret_heavy.png turret_light.png turret_gen.png (+ turret_heavy_dead.png … для знищених) — ствол дивиться вправо
     Окремо для борту: turret_heavy_0.png (лівий) / turret_heavy_1.png (правий) — те саме для light, gen і *_dead. Немає окремої — береться загальна.
   Звуки (mp3/ogg/wav): assets/turbolaser.mp3 light.mp3 blaster.mp3 shieldHit.mp3 shieldDown.mp3 torpedo.mp3
     explosion.mp3 bigExplosion.mp3 subDestroyed.mp3 radio.mp3 launch.mp3 warp.mp3 (вихід з гіперпростору)   і   assets/music.mp3 — фонова музика (loop)
     Назва шукається також у нижньому регістрі та з розширеннями .ogg/.wav (на Linux-серверах регістр важливий). Клавіша L у ?debug — перевірка всіх звуків.
   ===================================================================== */
const ASSETS={dir:'assets/',
  images:{ship0:'ship0.png',ship1:'ship1.png',background:'background.png'},
  craftImages:['interceptor','bait','flanker','gunship','shieldship','ace','bomber'],
  turretImages:['turret_heavy','turret_light','turret_gen','turret_heavy_dead','turret_light_dead','turret_gen_dead'], // assets/turret_heavy.png … (ствол дивиться вправо; *_dead — знищена, необов'язково)
  sounds:{turbolaser:'turbolaser.mp3',light:'light.mp3',blaster:'blaster.mp3',shieldHit:'shieldHit.mp3',shieldDown:'shieldDown.mp3',torpedo:'torpedo.mp3',explosion:'explosion.mp3',bigExplosion:'bigExplosion.mp3',subDestroyed:'subDestroyed.mp3',radio:'radio.mp3',launch:'launch.mp3',warp:'warp.mp3'},
  gain:{},               // індивідуальна гучність звуків, напр. {shieldDown:1.4, light:.6} (множник до CONFIG.volume)
  music:'music.mp3',
  disable:[]            // напр. ['radio','light'] — повністю вимкнути ці звуки
};
const CONFIG={
  // hull — форма корпусу: wedge (клин) | frigate (фрегат з широким носом) | carrier (авіаносець) | dreadnought (дредноут) | hammerhead (молот)
  // turrets — розташування турелей у координатах моделі: x від -150 (корма) до 150 (ніс), y від -50 (верх) до 50 (низ). null = стандарт для цієї форми.
  //           Кількість турелей будь-яка: heavy — великі турболазери, light — малі (зенітні), gen — генератор щита (одна точка)
  // shield  — форма щита: {mode:'hug', sx, sy, pad} оболонка по корпусу (sx/sy — розтяг уздовж/поперек, pad — відступ)
  //           {mode:'ellipse', rx, ry} еліпс (радіуси у частках довжини корабля) · {mode:'capsule', rx, ry} капсула. null = стандарт для форми
  //           Для PNG-корабля щит і турелі за замовчуванням автоматичні (див. pngShield / pngTurrets нижче); власні координати turrets для PNG притягуються на непрозорі пікселі
  ships:[
    {name:'Вартовий', callsign:'ВАРТОВИЙ-АКТУАЛ', squad:'ГРІМ',   color:'#5ec8ff', color2:'#d9f2ff', hull:'wedge', turrets:null, shield:null},
    {name:'Багряний', callsign:'БАГРЯНИЙ-АКТУАЛ', squad:'ЯСТРУБ', color:'#ff5a4a', color2:'#ffd2c8', hull:'frigate', turrets:null, shield:null},
  ],
  // ЯКЩО Є PNG КОРАБЛЯ (assets/ship0.png, ship1.png) — усе підлаштовується під картинку автоматично:
  //   щит іде за контуром PNG, турелі розставляються на корпусі (heavy по центру, light уздовж бортів, генератор на кормі), двигуни на кормі.
  //   Дві змінні нижче керують щитом; turrets:'auto' можна замінити власними координатами, shield — своїм режимом.
  pngShield:{pad:22, smooth:.6},   // pad — відступ щита від пікселів корабля (у пікселях моделі, 0..60); smooth — плавність обтікання 0 (різко, по кожному виступу) .. 1 (дуже м'яко)
  pngTurrets:{heavy:5, light:9},   // скільки турелей розставляти автоматично на PNG-кораблі (симетрично; непарна велика — на центральній лінії)
  extraTurrets:{heavy:2, light:3},  // для векторних корпусів: скільки турелей додати до стандартного розкладу форми (ставляться автоматично, симетрично)
  heavyRange:4200,                 // дальність великих турболазерів (px світу)
  turretSize:{heavy:20, light:11, gen:18},  // розмір турелей у пікселях моделі (діаметр)
  turretTurn:{heavy:1.5, light:6},          // швидкість повороту турелей, рад/с (велика — повільна й важка, мала — прудка)
  maxEngines:6,                    // двигуни: на перший непрозорий піксель з боку корми; кількість — за висотою сопла, до цього максимуму
  engineTolerance:10,              // px картинки: наскільки глибше за крайню кормову точку ще вважається соплом (окремі сопла → окремі вогні)
  fleetScale:1.8,                  // множник розміру ангарів (масштаб битви)
  shieldStyle:'plasma',            // 'plasma' — енергетична плівка (яскравий край, біжучі хвилі, інтерференція від влучань) · 'smooth' — проста оболонка
  shieldColor:'#9cd6ff',  // колір дефлекторних щитів (обом бортам)
  shipLength:1100, craftScale:2, world:{w:4200,h:2300}, // більше поле — усе на ньому виглядає меншим
  demoDuration:100,     // с — тривалість бою, якщо відкрити просто у браузері (у GMod — реальний прогрес, темп підлаштовується сам)
  volume:0.6, musicVolume:0.3,
  winner:null,          // null = випадково; 0 або 1
  tactics:null          // null = випадково; або ['strike','hedgehog'] (strike artillery swarm ambush gunline decap attrition pincer hedgehog blitz suppress)
};
/* ДЕБАГ / ТЕСТИ. URL: loading.html?debug  ?speed=3  ?tactics=strike,ambush  ?winner=0  ?p=0.5  ?demo=60
   Клавіші: L перевірка звуків · D панель+контури · Space пауза · +/- швидкість · 1..9 стрибок до 10..90% · N наступний бій (гіперстрибок) · R перезапуск
            T перемкнути тактики (наступна пара зі списку) · K збити щит переможеного · E евакуація · H сховати HUD · W поміняти переможця */
const URLP=new URLSearchParams(location.search);
if(URLP.get('tactics'))CONFIG.tactics=URLP.get('tactics').split(',');if(URLP.get('winner')!=null)CONFIG.winner=+URLP.get('winner');if(URLP.get('demo'))CONFIG.demoDuration=+URLP.get('demo');
const FAIR=/[?&]fair/.test(location.search); // чесний режим: без режисера, перемагає сильніший (для тестів тактик)
const DBG={nodraw:/[?&]nodraw/.test(location.search),on:/[?&]debug/.test(location.search),speed:+(URLP.get('speed')||1),pause:false,hud:true,forceP:URLP.get('p')?+URLP.get('p'):null,tacIdx:0};

/* ================= ОСНОВА ================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const WW=CONFIG.world.w,WH=CONFIG.world.h;let W=0,H=0,sc=1,ox=0,oy=0,T=0,shake=0;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;sc=Math.min(W/WW,H/WH);ox=(W-WW*sc)/2;oy=(H-WH*sc)/2;}
addEventListener('resize',resize);
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[Math.floor(Math.random()*a.length)];
const wrap=a=>{while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;};
const rgba=(hex,a)=>`rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})`;
const pip=(poly,x,y)=>{let r=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])r=!r;}return r;};
const load={gmod:false,total:0,needed:0,progress:0,disp:0,status:'Підключення',file:'',t0:null,p0:0,est:CONFIG.demoDuration,scaled:false};
let DM=1; // множник урону під темп завантаження
let run=0,runT=0,warp=-1,resultT=0,prevTactics=[null,null];const battle={p:0,virt:0,stallT:0,lastReal:-1,D:100,dispReal:0};
function loadImg(name){const i=new Image();i.ok=false;const url=ASSETS.dir+name;
  const plain=()=>{i.onload=()=>{i.ok=i.naturalWidth>0;};i.onerror=()=>{i.ok=false;};i.src=url;};
  if(window.fetch&&location.protocol!=='file:'){fetch(url,{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.blob();}).then(b=>{i.onload=()=>{i.ok=i.naturalWidth>0;i.blob=true;};i.onerror=()=>{i.ok=false;};i.src=URL.createObjectURL(b);}).catch(()=>plain());}
  else plain();return i;}
const IMG={bg:loadImg(ASSETS.images.background),ship:[loadImg(ASSETS.images.ship0),loadImg(ASSETS.images.ship1)],craft:[{},{}]};
ASSETS.craftImages.forEach(k=>{const g=loadImg(k+'.png');[0,1].forEach(s=>{const o=loadImg(k+'_'+s+'.png');IMG.craft[s][k]={g,o};});});
IMG.turret={};IMG.turretSide=[{},{}]; // загальна картинка + окремі для бортів: лівий (side 0) — _0, правий (side 1) — _1
const TURRET_SUFFIX=[['_0'],['_1']];
ASSETS.turretImages.forEach(k=>{const n=k.replace('turret_','');IMG.turret[n]=loadImg(k+'.png');TURRET_SUFFIX.forEach((sf,s)=>{IMG.turretSide[s][n]=sf.map(x=>loadImg(k+x+'.png'));});});
const turretImg=(side,n)=>{for(const i of (IMG.turretSide[side][n]||[]))if(i.ok)return i;const g=IMG.turret[n];return g&&g.ok?g:null;};
const craftImg=(side,k)=>{const e=IMG.craft[side][k];if(!e)return null;return e.o.ok?e.o:e.g.ok?e.g:null;};

/* ================= ЗВУК + МУЗИКА ================= */
// Кожен звук: assets/<ім'я> (mp3/ogg/wav, також пробується нижній регістр назви) → WebAudio-буфер.
// Файлу справді немає → синтезований звук. Заблокований автозапуск чи збій play() НІКОЛИ не перемикають звук на синтез.
const Snd={ctx:null,master:null,noise:null,st:{},bufs:{},pool:{},pend:{},act:{},last:{},muted:false,music:null,mus:null,
  JIT:{light:.08,blaster:.08,turbolaser:.05,shieldHit:.07,explosion:.06,torpedo:.04}, // випадкова зміна висоти — менше «кулеметності»
  MAXV:{light:5,blaster:5,turbolaser:6,shieldHit:5,shieldDown:3,explosion:6,bigExplosion:2,subDestroyed:4,torpedo:4,radio:2,launch:3,warp:2}, // макс. одночасних голосів

  decode(ab){return new Promise((ok,no)=>{const p=this.ctx.decodeAudioData(ab,ok,no);if(p&&p.catch)p.catch(no);});},

  async loadSound(name){const file=ASSETS.sounds[name];this.st[name]='loading';const web=this.ctx&&window.fetch&&location.protocol!=='file:';

  init(){try{const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=CONFIG.volume;this.master.connect(this.ctx.destination);

function fitToImage(c,o){ // контур PNG → корпус, щит (огинаюча з відступом і згладжуванням), симетричні турелі, двигуни на кормі

  // ДВИГУНИ: для кожного рядка — перший непрозорий піксель з боку корми. Рядки, де він не глибше за крайню точку + tolerance, — сопла.
  {const tol=CONFIG.engineTolerance||10;const first=[];for(let y=0;y<h;y++){let fx=-1;for(let x=minX;x<=Math.min(w-1,minX+tol+2);x++)if(A(x,y)>40){fx=x;break;}first.push(fx);}
    const segs=[];let run=null;for(let y=0;y<=h;y++){const on=y<h&&first[y]>=0&&first[y]<=minX+tol;if(on&&!run)run={t:y,b:y,fx:first[y]};else if(on){run.b=y;run.fx=Math.min(run.fx,first[y]);}else if(run){if(run.b-run.t>=3)segs.push(run);run=null;}}
    const eng=[],maxE=CONFIG.maxEngines||6,tot=segs.reduce((a,m)=>a+(m.b-m.t),0);
    for(const m of segs){const tL=ly(m.t),bL=ly(m.b),H=bL-tL;let n=Math.max(1,Math.round(H/(12*K)));n=Math.min(n,Math.max(1,Math.round(maxE*(m.b-m.t)/Math.max(1,tot))));
      for(let i=0;i<n;i++){const f=(i+1)/(n+1),yy=tL+H*f,py=Math.round((yy+c.ch/2)*2);let px=-1;for(let x=m.fx;x<=m.fx+tol+4&&x<w;x++)if(A(x,py)>40){px=x;break;} // перевірка: вогонь справді торкається корпусу
        if(px<0)continue;eng.push({x:lx(px),y:yy,r:clamp(H/(n+1)*.45,2.5*K,8*K)});}}

  // ТУРЕЛІ: симетрично відносно осі корабля
  const colAt=f=>{const x=minX+(maxX-minX)*f;let best=cols[0];for(const q of cols)if(Math.abs(q.x-x)<Math.abs(best.x-x))best=q;return best;};
  const onPix=(x,y)=>A(Math.round((x+c.cw/2)*2),Math.round((y+c.ch/2)*2))>40;

      if(shp.mode==='capsule'){const r=ry,cx=Math.max(0,rx-r);x=Math.cos(a)*r+Math.sign(Math.cos(a))*cx;y=Math.sin(a)*r;}pts.push([x*K,y*K]);}return pts;}

/* ================= СЦЕНАРІЙ (режисер) ================= */
let winner,loser,script=[],phaseName='';
const PH=[[0,'Зближення'],[.1,'Дуель винищувачів'],[.3,'Бомбардувальні рейди'],[.58,'Генеральна битва'],[.82,'Прорив оборони'],[.93,'Фінальний штурм']];
function planBattle(){
  const w=CONFIG.winner===0||CONFIG.winner===1?CONFIG.winner:(Math.random()<.5?0:1);winner=cruisers[w];loser=cruisers[1-w];
  const Wn=winner,Ln=loser,j=()=>rand(-.025,.025);
  loser.shieldFallAt=.70+j();winner.shieldFallAt=.86+j();if(FAIR){loser.shieldFallAt=9;winner.shieldFallAt=9;}
  const ev=(at,fn)=>script.push({at:clamp(at,0,.995),fn,done:false});
  const keys=Object.keys(TACTICS);
  cruisers.forEach((c,i)=>{const k=CONFIG.tactics&&run===0&&CONFIG.tactics[i]||pick(keys.filter(k=>k!==prevTactics[i]));prevTactics[i]=k;c.tactic=TACTICS[k];c.fireRate=c.tactic.fire;c.hangar={};for(const q in c.tactic.hangar)c.hangar[q]=Math.round(c.tactic.hangar[q]*(CONFIG.fleetScale||1));c.reserve={...c.tactic.reserve};
    document.getElementById('tac'+i).textContent=c.tactic.name;c.tactic.plan(c,(at,fn)=>ev(at+rand(-.015,.015),fn),cruisers[1-i]);});
  const A=c=>c.cs;
  ev(.005,()=>{radio('ЦЕНТР',`Два крейсери вийшли з гіперпростору. Дистанція ${Math.round(rand(80,120))} тис. км.`,'#ffe81f',1);});
  ev(.02,()=>{cruisers.forEach(c=>radio(A(c),`Контакт. Бойова тривога. Тактика: «${c.tactic.name}». ${c.tactic.brief}`,c.col));});
  ev(.08,()=>{cruisers.forEach(c=>c.canFire=true);radio(A(Wn),'Дистанція ефективна. Головний калібр — вогонь!',Wn.col);radio(A(Ln),'Турболазери — вогонь по готовності. Тримати щити.',Ln.col);});
  ev(.25+j(),()=>{radio(SQ(pick(cruisers)),pick(['Зайнятий, зайнятий! Двоє на хвості!','Є один! Горить!','Головний калібр по мені — пройшов повз, ухилився.']),'#e6f3ff');});
  ev(.45+j(),()=>{radio(SQ(pick(cruisers)),pick(['Торпеди пішли! Є влучання!','Під щитом, бачу генератор. Пуск!','Зенітка щільна, втратили двійку!']),'#e6f3ff');});
  ev(loser.shieldFallAt-.11,()=>{recall(Ln,loser.shieldFallAt-.04,'Відступ! Усім МЛА — назад під гармати. Перегрупування біля корабля.');});
  ev(loser.shieldFallAt-.04,()=>{radio(A(Ln),'Перегрупувались. Контратака — усі разом, строєм!',Ln.col);});
  ev(loser.shieldFallAt,()=>{if(!Ln.shieldDown){radio(A(Ln),'Генератор щитів перевантажено! Щит іде!',Ln.col);shieldCollapse(Ln);}radio(A(Wn),'Їхні щити впали. Усім МЛА — по турелях, від найслабшої!',Wn.col);});
  ev(winner.shieldFallAt,()=>{if(!Wn.shieldDown){radio(A(Wn),'Генератор на межі… Щит втрачено. Тримаємо корпус!',Wn.col);shieldCollapse(Wn);}radio(A(Ln),'Їхній щит теж впав! Усе що лишилось — по їхніх турелях!',Ln.col);});
  // елітна ланка переможця під кінець завантаження
  if(!FAIR)ev(.88,()=>{Wn.hangar.ace=(Wn.hangar.ace||0)+3;Wn.queue.push(...Q.ace(3,8));radio(A(Wn),`Елітна ескадрилья «${Wn.squad}-ПРАЙМ» — на старт. Зачистити небо і добити турелі.`,Wn.col);});
  ev(.9+j(),()=>{radio(A(Ln),pick(['Пробоїна в реакторному! Втрачаємо тягу!','Пожежа на третій палубі, корпус тріщить!']),Ln.col);});
  if(!FAIR)ev(.93,()=>{Wn.fireRate=Math.max(Wn.fireRate,1.6);Wn.hangar.bomber=(Wn.hangar.bomber||0)+2;Wn.queue.push(...Q.bomb(2,9));radio(A(Wn),`Усім кораблям — фінальний штурм. Добити.`,Wn.col);});
  ev(.965,()=>{radio(A(Ln),pick(['Реактор критичний… Усім залишити корабель!','Це кінець. Евакуація. Честь була служити з вами.']),Ln.col);});
  ev(.995,()=>{radio('ЦЕНТР',`Сигнал крейсера ${Ln.name} втрачено.`,'#ffe81f',1);});
}
function runScript(p){for(const e of script){if(!e.done&&p>=e.at){e.done=true;e.fn();}}
  const ph=PH.filter(x=>p>=x[0]).pop();if(ph&&ph[1]!==phaseName){phaseName=ph[1];document.getElementById('phase').textContent=(run?`Бій ${run+1} · `:'')+phaseName;}}
// підлаштування під тривалість завантаження: довше завантаження → більші ангари; коротше → більший урон
function applyTempo(){const D=load.est,scale=clamp(Math.pow(D/100,.8)*1.15,.6,2.6);DM=clamp(Math.sqrt(100/D),.6,2.2);
  cruisers.forEach(c=>{for(const k in c.hangar)c.hangar[k]=Math.max(1,Math.round(c.hangar[k]*scale));for(const k in c.reserve)c.reserve[k]=Math.max(1,Math.round(c.reserve[k]*scale));});}

  const myF=mine.filter(k=>k.type!=='bomber'&&k.type!=='shieldship').length;
  const near=theirs.filter(k=>Math.hypot(k.x-c.x,k.y-c.y)<750);
  const thF=near.filter(k=>k.type!=='bomber').length,thB=near.filter(k=>k.type==='bomber').length;
  const qF=c.queue.filter(q=>q[0]!=='bomber').length,qB=c.queue.length-qF;

  if(need>0&&(c.hangar.interceptor||0)-qF>0){const n=Math.min(need,3,c.hangar.interceptor-qF);c.queue.push(...Q.cap(n));
    if(n>=2)radio(c.cs,pick([`Підняти ще ${n} перехоплювачі. Бомбери на підході!`,`Ангар, ${n} борти на старт, негайно.`]),c.col);}
  { // постійна охорона корабля: мінімум конвою завжди в повітрі
    const minC=Math.round(2*FS()),nC=crafts.filter(k=>k.side===c.side&&k.role==='convoy'&&!k.flee&&k.state!=='retreat').length+c.queue.filter(q=>q[1]==='convoy').length;
    if(nC<minC&&(c.hangar.interceptor||0)>0){c.queue.unshift(...Q.convoy(Math.min(minC-nC,c.hangar.interceptor)));}}
  c.raidCd-=.8;
  if(en.alive&&en.shieldDown&&(c.hangar.bomber||0)-qB>=2&&c.raidCd<=0&&mine.filter(k=>k.type==='bomber').length<3){
    c.raidCd=25;c.queue.push(...Q.bomb(Math.min(c.hangar.bomber-qB,2),9));

/* ================= ШІ МЛА ================= */
const roleIdx=cr=>{let i=0;for(const k of crafts){if(k===cr)return i;if(k.side===cr.side&&k.role===cr.role&&!k.flee&&k.state!=='retreat')i++;}return i;};
const spreadY=(i,step)=>((i%2?1:-1)*Math.ceil(i/2))*step; // 0, +s, -s, +2s, -2s …
function threatTo(cr,R){let best=null,bd=R;for(const k of crafts){if(k.side===cr.side||k.flee||k.target!==cr)continue;const d=Math.hypot(k.x-cr.x,k.y-cr.y);if(d<bd){bd=d;best=k;}}return best;}
function snapTarget(cr,R,cone){let best=null,bd=R;for(const k of crafts){if(k.side===cr.side||k.flee)continue;const dx=k.x-cr.x,dy=k.y-cr.y,d=Math.hypot(dx,dy);if(d>=bd)continue;if(Math.abs(wrap(Math.atan2(dy,dx)-cr.a))>cone)continue;bd=d;best=k;}return best;}
function nearEnemyCraft(cr,R,bombersFirst){const theirs=crafts.filter(k=>k.side!==cr.side&&k.hp>0&&!k.flee);let best=null,bd=1e9;
  if(bombersFirst){const me=cruisers[cr.side];for(const k of theirs){if(k.type!=='bomber')continue;if(Math.hypot(k.x-me.x,k.y-me.y)<800){const q=Math.hypot(k.x-cr.x,k.y-cr.y);if(q<bd){bd=q;best=k;}}}if(best)return best;}
  for(const k of theirs){const q=Math.hypot(k.x-cr.x,k.y-cr.y);if(q<bd&&q<R){bd=q;best=k;}}return best;}
function bomberTarget(cr,en){for(const k of cr.prio){if(k==='hull')return {kind:'hull'};const s=k==='light'?weakestSub(en,false):nearestSub(en,k,cr.x,cr.y);if(s)return {kind:k,sub:s};}return {kind:'hull'};}
// щитоносець: стає на лінію вогню між ворожим крейсером і своїм корпусом, під конкретний болт, що летить
function screenPoint(cr,me,en){const i=roleIdx(cr),row=Math.floor(i/6);const q=fwd(me,me.len*.62+row*40,spreadY(i%6,52*CS)),xs=q.x,ys=q.y;if(me.tactic&&me.tactic.screenFixed)return {x:xs,y:ys};let best=null,bd=1e9;
  const fa=fwdAngle(me),nx=-Math.sin(fa),ny=Math.cos(fa);const base=fwd(me,me.len*.62,0);
  for(const b of bolts){if(b.kind!=='turbo'||b.side===cr.side||b.claimed&&b.claimed!==cr)continue;const vf=b.vx*Math.cos(fa)+b.vy*Math.sin(fa);if(Math.abs(vf)<1)continue;const t=((base.x-b.x)*Math.cos(fa)+(base.y-b.y)*Math.sin(fa))/vf;if(t<0||t>1.2)continue;const px=b.x+b.vx*t,py=b.y+b.vy*t;const lat=(px-base.x)*nx+(py-base.y)*ny;if(Math.abs(lat)>me.len*.3)continue;const d=Math.hypot(px-cr.x,py-cr.y);if(d<bd){bd=d;best={x:base.x+nx*lat,y:base.y+ny*lat,b};}}
  if(best){best.b.claimed=cr;return best;}return {x:xs,y:ys};}
/* РУШІЙ РУХУ МЛА.  Три режими цілі: station — утримувати точку (носом до ворога або за заданим курсом),
   travel — долетіти до точки з гальмуванням і стати, pass — бойовий захід: пряма атака на ціль, прохід крізь неї й відхід на точку далі за ціллю, потім новий захід.
   Жодного переслідування по спіралі: якщо ціль поруч або позаду — борт не крутиться, а відводить і заходить заново. */
function passGoal(cr,tx,ty,P){ // повертає {x,y,mode:'pass',onTarget:bool}
  if(cr.pass){const d=Math.hypot(cr.pass.x-cr.x,cr.pass.y-cr.y);cr.pass.t+=dt_;if(d<34||cr.pass.t>3.5)cr.pass=null;else return {x:cr.pass.x,y:cr.pass.y,mode:'pass',onTarget:false};}
  const dx=tx-cr.x,dy=ty-cr.y,d=Math.hypot(dx,dy)||1,cosA=(dx*Math.cos(cr.a)+dy*Math.sin(cr.a))/d;
  if(d<60*CS||(cosA<.2&&d<170*CS)){ // пройшли ціль / вона збоку-позаду → відхід прямо вперед, потім новий захід
    const ex=clamp(cr.x+Math.cos(cr.a)*260*CS,40,WW-40),ey=clamp(cr.y+Math.sin(cr.a)*260*CS,40,WH-40);cr.pass={x:ex,y:ey,t:0};return {x:ex,y:ey,mode:'pass',onTarget:false};}
  return {x:tx,y:ty,mode:'pass',onTarget:true};
}

  for(let i=debris.length-1;i>=0;i--){const q=debris[i];q.life-=dt_;if(q.life<=0){debris.splice(i,1);continue;}q.x+=q.vx*dt_;q.y+=q.vy*dt_;q.vx*=.97;q.vy*=.97;const a=Math.atan2(q.vy,q.vx);ctx.strokeStyle=rgba(q.col,q.life/q.max);ctx.lineWidth=q.spin?1.6:1;ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-Math.cos(a)*q.len,q.y-Math.sin(a)*q.len);ctx.stroke();}
  for(let i=pods.length-1;i>=0;i--){const q=pods[i];q.life-=dt_;if(q.life<=0||q.x<-100||q.x>WW+100){pods.splice(i,1);continue;}q.x+=q.vx*dt_;q.y+=q.vy*dt_;q.t+=dt_;
    ctx.save();ctx.translate(q.x,q.y);ctx.rotate(Math.atan2(q.vy,q.vx));ctx.fillStyle='#d8dde6';ctx.strokeStyle='#3a4250';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(0,0,7,3.5,0,0,6.29);ctx.fill();ctx.stroke();
    ctx.fillStyle=rgba('#ffffff',.5+.5*Math.sin(q.t*8));ctx.beginPath();ctx.arc(-7,0,1.6,0,6.29);ctx.fill();ctx.fillStyle=rgba(q.col,.6);ctx.beginPath();ctx.arc(2,0,1.4,0,6.29);ctx.fill();ctx.restore();}
  crafts.forEach(drawCraft);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt_;if(p.life<=0){parts.splice(i,1);continue;}p.x+=p.vx*dt_;p.y+=p.vy*dt_;const a=p.life/p.max;
    ctx.globalAlpha=p.smoke?a*.35:a;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.1,p.flash?p.r*a:p.r*(p.smoke?(2-a):1)),0,6.29);ctx.fill();}
  ctx.globalAlpha=1;if(shake>0)shake*=.9;if(shake<.3)shake=0;
  if(DBG.on)drawDebug();
}
function drawDebug(){ctx.lineWidth=1;for(const c of cruisers){if(c.gone)continue;ctx.strokeStyle='rgba(255,80,80,.8)';ctx.beginPath();c.hullW.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.stroke();
    ctx.strokeStyle='rgba(80,255,120,.8)';ctx.beginPath();c.shieldW.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.stroke();
    (c.engines||[]).forEach(e=>{ctx.strokeStyle='#ff0';ctx.strokeRect(c.x+e.x*c.dir-3,c.y+e.y-3,6,6);});for(const s of c.subs){const q=subPos(c,s);ctx.strokeStyle=s.alive?'#0ff':'#f00';ctx.strokeRect(q.x-4,q.y-4,8,8);}}
  ctx.font='9px monospace';for(const k of crafts){ctx.fillStyle=k.side?'#ffb0a0':'#a0d8ff';ctx.fillText(k.role+(k.state?'/'+k.state:'')+' '+Math.ceil(k.hp),k.x+10,k.y-8);if(k.fx!=null){ctx.strokeStyle='rgba(255,255,0,.4)';ctx.beginPath();ctx.moveTo(k.x,k.y);ctx.lineTo(k.fx,k.fy);ctx.stroke();}}
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(W/2-180,110,360,138);ctx.fillStyle='#8f8';ctx.font='11px monospace';const rl=[`T=${T.toFixed(1)} speed=${DBG.speed} pause=${DBG.pause} run=${run} warp=${warp.toFixed(2)}`,`real=${load.progress.toFixed(3)} battle.p=${battle.p.toFixed(3)} disp=${load.disp.toFixed(3)} est=${load.est.toFixed(0)}s DM=${DM.toFixed(2)}`,
    ...cruisers.map(c=>`${c.name}: ${c.tactic?c.tactic.name:'-'} H${(c.hull*100)|0} S${c.shieldDown?'X':(c.shield*100)|0} q=${c.queue.length} hangar=${Object.entries(c.hangar).map(e=>e[0][0]+e[1]).join(' ')}`),
    `crafts=${crafts.length} bolts=${bolts.length} parts=${parts.length} pods=${pods.length} ${JSON.stringify(crafts.reduce((a,k)=>{a[k.role]=(a[k.role]||0)+1;return a;},{}))}`.slice(0,70),
    Snd.report().slice(0,62),
    'D Space +/- 1-9 N R T K E H W L'];rl.forEach((t,i)=>ctx.fillText(t,W/2-174,128+i*17));}

/* ================= ЦИКЛ ================= */
let last=performance.now();
// Симуляція відокремлена від малювання: коли вкладка/вікно сховані, requestAnimationFrame зупиняється,
// тому бій далі рахує таймер (Web Worker — його браузер не гальмує; запасний варіант — setInterval) без малювання.
function tick(now,vis){let dt=Math.min(vis?.05:2,Math.max(0,(now-last)/1000));last=now;if(DBG.pause)dt=0;dt*=DBG.speed;
  const steps=Math.max(1,Math.ceil(dt/.034));const sd=dt/steps;
  for(let k=0;k<steps;k++){T+=sd;dt_=sd;updLoad(sd);cruisers.forEach(c=>updCruiser(c,sd));for(let i=crafts.length-1;i>=0;i--)updCraft(crafts[i],i,sd);separate(sd);updBolts(sd);}
  dt_=dt;flushRadio(dt);updHUD(dt);if(vis&&!DBG.nodraw)draw();}
function frame(now){tick(now,true);requestAnimationFrame(frame);}
function bgTick(){if(document.hidden)tick(performance.now(),false);}
try{const w=new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(0)},100)'],{type:'application/javascript'})));w.onmessage=bgTick;w.onerror=()=>{};}catch(e){}
setInterval(bgTick,250); // запасний таймер, якщо Worker недоступний
addEventListener('keydown',e=>{const k=e.key;const L=loser;
  if(k==='d'||k==='D'||k==='в'||k==='В'){DBG.on=!DBG.on;}
  else if(k===' '){DBG.pause=!DBG.pause;e.preventDefault();}
  else if(k==='+'||k==='='){DBG.speed=Math.min(8,DBG.speed*2);}else if(k==='-'){DBG.speed=Math.max(.25,DBG.speed/2);}
  else if(k>='1'&&k<='9'){const tp=+k/10;if(run===0){load.progress=Math.max(load.progress,tp);battle.virt=tp;battle.lastReal=tp;if(!load.gmod){load.gmod=true;load.total=100;load.needed=Math.round(100-tp*100);}}else runT=T-tp*battle.D;load.disp=tp;}
  else if(k==='n'||k==='N'){if(warp<0)startWarp();}
  else if(k==='r'||k==='R'){warp=-1;run--;restartBattle();}
  else if(k==='t'||k==='T'){const keys=Object.keys(TACTICS);DBG.tacIdx=(DBG.tacIdx+1)%(keys.length*keys.length);CONFIG.tactics=[keys[DBG.tacIdx%keys.length],keys[(DBG.tacIdx/keys.length|0)]];run=-1;warp=-1;restartBattle();}
  else if(k==='l'||k==='L'){Object.keys(ASSETS.sounds).forEach((n,i)=>setTimeout(()=>{console.log('[snd] '+n+' → '+Snd.st[n]);Snd.play(n,1,null,true);},i*1500));}
  else if(k==='k'||k==='K'){if(L&&!L.shieldDown)shieldCollapse(L);}
  else if(k==='e'||k==='E'){if(L&&!L.evac){L.evac=true;L.podsLeft=14;radio(L.cs,'Усім залишити корабель!',L.col);}}
  else if(k==='h'||k==='H'){DBG.hud=!DBG.hud;document.querySelectorAll('#top,#radio,#bottom,#mute').forEach(el=>el.style.display=DBG.hud?'':'none');}
  else if(k==='w'||k==='W'){CONFIG.winner=winner?1-winner.side:0;run=-1;warp=-1;restartBattle();}});

/* ================= КОЛБЕКИ GARRY'S MOD ================= */
window.GameDetails=function(servername,serverurl,mapname,maxplayers,steamid,gamemode){load.gmod=true;
  document.getElementById('srv').textContent=servername||'Сервер';document.getElementById('map').textContent='Карта: '+mapname+' · Режим: '+gamemode+' · Слоти: '+maxplayers;};
window.SetFilesTotal=function(t){load.gmod=true;load.total=t;load.needed=t;}; // до першого SetFilesNeeded вважаємо, що нічого ще не скачано
window.SetFilesNeeded=function(n){load.gmod=true;load.needed=n;};
window.DownloadingFile=function(f){load.file=f;};
window.SetStatusChanged=function(s){load.status=s;load.file='';};

/* ================= СТАРТ ================= */
for(let i=0;i<420;i++)stars.push({x:Math.random(),y:Math.random(),r:rand(.3,1.7),a:rand(.15,.9),tw:rand(1,4),p:rand(0,6),d:rand(.5,2)});
cruisers.push(mkCruiser(0),mkCruiser(1));resize();cruisers.forEach(c=>{c.hullW=c.hullL.map(q=>{const w=wp(c,q[0],q[1]);return [w.x,w.y];});c.shieldW=c.shieldL.map(q=>{const w=wp(c,q[0],q[1]);return [w.x,w.y];});});
cruisers.forEach((c,i)=>{document.getElementById('n'+i).textContent=c.name;});
setRot();planBattle();Snd.init();requestAnimationFrame(frame);
</script>
